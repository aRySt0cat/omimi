# XcodeGen 定義: `cd ios && xcodegen` で Omimi.xcodeproj を生成する
name: Omimi
options:
  bundleIdPrefix: local.omimi
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

packages:
  OmiKit:
    path: OmiKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Omimi:
    type: application
    platform: iOS
    sources:
      - path: Omimi
    dependencies:
      - package: OmiKit
        product: OmiKit
      - package: OmiKit
        product: OmiTranscription
      - package: OmiKit
        product: OmiSpeakers
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(OMI_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # 話者分離のモデル (Omimi/Models/*.mlpackage) はコンパイルして同梱し、URL で読む (クラスは作らない)
        COREML_CODEGEN_LANGUAGE: None
    info:
      path: Omimi/Info.plist
      properties:
        CFBundleDisplayName: Omimi
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSBluetoothAlwaysUsageDescription: Omi デバイスから音声を受信するために Bluetooth を使用します。
        NSSpeechRecognitionUsageDescription: 録音した音声を端末内で文字起こしします。音声は端末の外へ送信されません。
        UIBackgroundModes:
          - bluetooth-central
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - $(PRODUCT_BUNDLE_IDENTIFIER).backlog
