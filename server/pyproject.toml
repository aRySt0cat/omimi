[project]
name = "omi-home-server"
version = "0.1.0"
description = "Omi 自作アプリ用の自宅サーバ: 音声と文字起こしの受信・保存・(必要に応じて) Whisper による文字起こし"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    # Ogg Opus のデコード (FFmpeg 同梱 wheel)
    "av>=12",
    "numpy>=1.26",
    # 話者分離・話者埋め込み (onnxruntime 同梱, PyTorch 不要)。
    # sherpa-onnx の wheel は依存 (core) を動的に宣言するため、core も明示して同じ版に固定する。
    "sherpa-onnx==1.13.8",
    "sherpa-onnx-core==1.13.8",
    # Sign in with ChatGPT: OpenAI の認可・Responses API との通信と、ID トークンの署名の確認
    "httpx>=0.27",
    "cryptography>=43",
]

[project.optional-dependencies]
# CPU / x86_64 CUDA / Apple Silicon (CPU) 向け
faster-whisper = ["faster-whisper>=1.1"]
# DGX Spark などの PyTorch 環境向け (torch はコンテナ/環境側のものを使う)
transformers = ["transformers>=4.45"]

[project.scripts]
omi-server = "omi_home_server.cli:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["omi_home_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
